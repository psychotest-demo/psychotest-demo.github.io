<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f0e4">
  <title>心行实验</title>
  <link rel="stylesheet" href="./fonts/wenkai.css">
  <link rel="stylesheet" href="./style.css?v=20261126">
  <script type="module" src="./app.js?v=20261126"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="brand" href="./" aria-label="心行实验首页"><span class="brand-mark" aria-hidden="true">心</span></a>
      <div class="header-actions">
        <button type="button" id="previous" class="link-button" disabled>返回上一页</button>
        <span id="mode-label" class="mode" hidden>流程测试</span>
        <button type="button" id="exit" class="link-button" hidden>退出实验</button>
      </div>
    </div>
  </header>
  <main id="app" class="app" aria-busy="true"><p class="waiting" role="status">正在打开实验页面…</p></main>
  <footer class="footer"><span>心行实验</span><span>流程演示</span></footer>
  <div id="achievement" class="achievement" role="status" aria-live="polite"></div>
  <dialog id="exit-dialog">
    <form method="dialog">
      <h2>结束本次参与？</h2>
      <p>退出后，本次体验将结束。</p>
      <div class="button-row"><button class="secondary" value="cancel">继续参与</button><button class="primary" value="exit">确认退出</button></div>
    </form>
  </dialog>
</body>
</html>
